<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>LEARN</title>
  <style>
    :root {
      --bg: #191919;
      --panel: #232323;
      --hover: #303030;
      --border: #484848;
      --text: #f0f0f0;
      --muted: #c1c1c1;
      --faint: #ababab;
      --accent: #b9afff;
      --known: #9384ff;
      --ready: #dec4ff;
      --later: #a9a9a9;
      --warning: #f0ca82;
      --danger: #ffaaaa;
      color: var(--text);
      background: var(--bg);
      font: 14px/1.55 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    button, a { color: inherit; font: inherit; }
    button { border: 0; }
    a { color: var(--accent); text-underline-offset: 3px; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .skip { position: fixed; z-index: 50; top: 8px; left: 8px; padding: 8px 10px; background: #fff; color: #111; transform: translateY(-160%); }
    .skip:focus { transform: none; }
    .app { height: 100%; display: grid; grid-template-columns: 260px minmax(0, 1fr); }
    .sidebar { min-width: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; border-right: 1px solid var(--border); background: var(--panel); }
    .brand { min-height: 46px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); color: var(--text); font-weight: 700; text-decoration: none; }
    .brand svg { width: 16px; color: var(--accent); }
    .brand span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav { padding: 9px; border-bottom: 1px solid var(--border); }
    .nav-link, .topic-link, .note-link {
      width: 100%; min-height: 34px; padding: 6px 8px; border-radius: 6px; display: flex; align-items: center; gap: 8px;
      color: var(--muted); text-align: left; text-decoration: none;
    }
    .nav-link:hover, .topic-link:hover, .note-link:hover, [aria-current="page"] { color: var(--text); background: var(--hover); }
    .tree { min-height: 0; padding: 10px 8px 18px; overflow: auto; scrollbar-width: thin; }
    .tree-label { margin: 9px 8px 5px; color: var(--faint); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .project { margin: 0 0 8px; }
    .project summary { min-height: 32px; padding: 5px 8px; color: var(--muted); cursor: pointer; font-weight: 650; list-style: none; overflow-wrap: anywhere; }
    .project summary::before { content: "›"; display: inline-block; width: 15px; color: var(--faint); }
    .project[open] summary::before { transform: rotate(90deg); }
    .project summary::-webkit-details-marker { display: none; }
    .plain-list { margin: 0; padding: 0; list-style: none; }
    .topic-link { min-height: 30px; padding-left: 23px; }
    .note-link { align-items: flex-start; flex-wrap: wrap; }
    .state-dot { width: 9px; height: 9px; margin-top: 6px; flex: none; border: 2px solid currentColor; border-radius: 50%; }
    .state-dot.known { color: var(--known); background: currentColor; }
    .state-dot.ready { color: var(--ready); background: transparent; }
    .state-dot.later { color: var(--later); border-style: dashed; }
    .note-name { min-width: 0; flex: 1; overflow-wrap: anywhere; }
    .state-label { width: 100%; padding-left: 17px; color: var(--faint); font-size: 11px; }
    .sidebar-foot { padding: 10px 14px; border-top: 1px solid var(--border); color: var(--faint); font-size: 12px; }
    .workspace { min-width: 0; min-height: 0; display: grid; grid-template-rows: 46px minmax(0, 1fr); }
    .titlebar { padding: 0 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
    .menu { display: none; width: 34px; height: 34px; border-radius: 6px; background: transparent; cursor: pointer; }
    .menu:hover { background: var(--hover); }
    .breadcrumb { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 13px; }
    .breadcrumb a { color: var(--muted); }
    .breadcrumb strong { color: var(--text); }
    .status { flex: none; padding: 2px 8px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); font-size: 11px; font-weight: 650; }
    .status.warning { color: var(--warning); border-color: #806b42; }
    .status.danger { color: var(--danger); border-color: #884f4f; }
    .view { min-width: 0; min-height: 0; overflow: auto; }
    .document { width: min(820px, calc(100% - 48px)); margin: 0 auto; padding: 52px 0 90px; }
    .document.wide { width: min(1180px, calc(100% - 48px)); }
    h1 { margin: 0 0 10px; font-size: clamp(30px, 5vw, 44px); line-height: 1.12; letter-spacing: -.035em; }
    h2 { margin: 34px 0 12px; font-size: 23px; line-height: 1.25; }
    h3 { margin: 27px 0 9px; font-size: 18px; }
    h4 { margin: 23px 0 8px; font-size: 15px; }
    p, ul, ol, blockquote, pre { margin: 0 0 18px; }
    li + li { margin-top: 6px; }
    .lede { max-width: 70ch; color: var(--muted); font-size: 16px; }
    .meta { margin: 0 0 28px; color: var(--faint); font-size: 12px; }
    .empty { margin-top: 26px; padding: 22px; border: 1px dashed var(--border); border-radius: 8px; color: var(--muted); }
    .cards { margin: 26px 0 0; padding: 0; display: grid; gap: 10px; list-style: none; }
    .card { padding: 13px 15px; display: block; border: 1px solid var(--border); border-radius: 8px; color: var(--text); text-decoration: none; }
    .card:hover { border-color: #696969; background: var(--hover); }
    .card strong { display: block; }
    .card small { color: var(--muted); }
    .callout { margin: 20px 0; padding: 12px 14px; border-left: 4px solid var(--warning); border-radius: 4px; background: #332e24; color: #f4dfb7; }
    .callout.danger { border-color: var(--danger); background: #392626; color: #ffd0d0; }
    .content-section { margin: 34px 0; padding: 1px 0 1px 18px; border-left: 4px solid var(--known); }
    .content-section.conflict { border-color: var(--danger); background: linear-gradient(90deg, #39262688, transparent 60%); }
    .section-label, .badge { display: inline-block; margin: 0 5px 8px 0; padding: 2px 7px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); font-size: 11px; font-weight: 650; text-transform: capitalize; }
    blockquote { padding-left: 14px; border-left: 3px solid var(--border); color: var(--muted); }
    code { padding: 2px 5px; border-radius: 4px; background: #303030; font: .92em ui-monospace, SFMono-Regular, Menlo, monospace; }
    pre { padding: 16px; overflow: auto; border: 1px solid var(--border); border-radius: 7px; background: #111; }
    pre code { padding: 0; background: none; }
    .references { margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
    .references h3 { margin-top: 0; font-size: 14px; }
    .source-card { position: relative; }
    .source-card .badge { margin-top: 8px; }
    .source-problem { margin: 10px 0 0; color: var(--danger); }
    .concept-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 24px; }
    .relation-list { padding-left: 20px; }
    .graph-frame { margin-top: 24px; overflow: auto; border: 1px solid var(--border); border-radius: 9px; background: #151515; }
    .graph { display: block; min-width: 100%; }
    .edge { fill: none; stroke: #858585; stroke-width: 1.6; }
    .graph-node rect { stroke-width: 2; rx: 8; }
    .graph-node.known rect { fill: #3d3478; stroke: var(--known); }
    .graph-node.ready rect { fill: #30283a; stroke: var(--ready); }
    .graph-node.later rect { fill: #292929; stroke: var(--later); stroke-dasharray: 5 4; }
    .graph-node:hover rect, .graph-node:focus rect { filter: brightness(1.25); }
    .graph-node text { fill: var(--text); font-size: 13px; pointer-events: none; }
    .graph-node .graph-state { fill: var(--muted); font-size: 11px; }
    .graph-legend { margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted); font-size: 12px; }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; }
    .legend-item .state-dot { margin: 0; }
    .scrim { display: none; }
    .data-error { position: fixed; z-index: 60; top: 58px; right: 14px; max-width: 420px; padding: 12px 14px; border: 1px solid #995858; border-radius: 7px; color: #ffd0d0; background: #392626; }
    @media (max-width: 760px) {
      .app { display: block; }
      .workspace { height: 100%; }
      .sidebar { position: fixed; z-index: 30; inset: 0 auto 0 0; width: min(310px, 88vw); transform: translateX(-105%); box-shadow: 15px 0 38px #0009; }
      .sidebar.open { transform: none; }
      .menu { display: inline-grid; place-items: center; }
      .scrim { position: fixed; z-index: 20; inset: 0; display: block; width: 100%; height: 100%; background: #0009; cursor: default; }
      .document, .document.wide { width: min(100% - 30px, 820px); padding-top: 34px; }
    }
    @media (prefers-reduced-motion: no-preference) and (max-width: 760px) { .sidebar { transition: transform .16s ease; } }
  </style>
</head>
<body>
  <button class="skip" id="skip" type="button">Skip to content</button>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Learning workspace">
      <a class="brand" id="brand" href="#workspace"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2 3 7v10l9 5 9-5V7Zm0 2.3 6.8 3.8L12 12 5.2 8.1Zm-7 5.5 6 3.4v6L5 15.8Zm8 9.4v-6l6-3.4v6Z"/></svg><span id="workspace-name">LEARN</span></a>
      <nav class="nav" id="view-nav" aria-label="Topic views">
        <a class="nav-link" id="open-graph" href="#workspace">Concept graph</a>
        <a class="nav-link" id="open-sources" href="#workspace">Sources</a>
        <a class="nav-link" id="open-session" href="#workspace" hidden>Preview</a>
      </nav>
      <div class="tree">
        <p class="tree-label">Workspace</p>
        <div id="project-tree"></div>
        <div id="concept-index" hidden><p class="tree-label">Concepts</p><ul class="plain-list" id="concept-list"></ul></div>
        <div id="answer-index" hidden><p class="tree-label">General answers</p><ul class="plain-list" id="answer-list"></ul></div>
      </div>
      <div class="sidebar-foot">Read only · continue in chat</div>
    </aside>
    <button class="scrim" id="scrim" type="button" aria-label="Close navigation" hidden></button>
    <section class="workspace">
      <header class="titlebar">
        <button class="menu" id="menu" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
        <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></nav>
        <span class="status" id="status" role="status" hidden></span>
      </header>
      <main class="view" id="main" tabindex="-1"></main>
    </section>
  </div>
  <div class="data-error" id="data-error" role="alert" hidden>Rendered workspace data is invalid.</div>
  <script type="application/json" id="learn-data">__LEARN_DATA__</script>
  <script>
    (() => {
      let data;
      try { data = JSON.parse(document.getElementById("learn-data").textContent); }
      catch (error) { const alert = document.getElementById("data-error"); alert.textContent += ` ${error.message}`; alert.hidden = false; return; }

      const $ = selector => document.querySelector(selector);
      const main = $("#main");
      const sidebar = $("#sidebar");
      const workspace = $(".workspace");
      const mobile = matchMedia("(max-width: 760px)");
      const text = value => value == null ? "" : String(value);
      const compareConcepts = (left, right) => left.label === right.label ? (left.id < right.id ? -1 : left.id > right.id ? 1 : 0) : (left.label < right.label ? -1 : 1);
      const node = (tag, attributes = {}, ...children) => {
        const element = document.createElement(tag);
        for (const [name, value] of Object.entries(attributes)) {
          if (value == null || value === false) continue;
          if (name === "class") element.className = value;
          else if (name === "text") element.textContent = value;
          else element.setAttribute(name, value === true ? "" : value);
        }
        for (const child of children.flat()) if (child != null) element.append(child.nodeType ? child : document.createTextNode(text(child)));
        return element;
      };
      const routeHref = (...parts) => `#${parts.map(encodeURIComponent).join("/")}`;
      const topicFor = (projectId, topicId) => data.topics.find(topic => topic.projectId === projectId && topic.id === topicId);
      const projectFor = id => data.workspace.projects.find(project => project.id === id);
      const sourceFor = (topic, id) => topic.sources.find(source => source.id === id);
      const safeHttps = value => { try { const url = new URL(text(value)); return url.protocol === "https:" && !url.username && !url.password ? url.href : null; } catch { return null; } };
      const safeLocal = value => { if (typeof value !== "string" || !value) return null; try { const url = new URL(value, document.baseURI); return url.protocol === "file:" ? url.href : null; } catch { return null; } };

      function defaultRoute() {
        const current = data.workspace.current;
        return current && topicFor(current.projectId, current.topicId) ? { kind: "topic", projectId: current.projectId, topicId: current.topicId, view: "graph" } : { kind: "workspace" };
      }

      function parseRoute() {
        let parts;
        try { parts = location.hash.slice(1).split("/").filter(Boolean).map(decodeURIComponent); } catch { return defaultRoute(); }
        if (!parts.length) return defaultRoute();
        if (parts[0] === "workspace") return { kind: "workspace" };
        if (parts[0] === "project" && projectFor(parts[1])) return { kind: "project", projectId: parts[1] };
        const topic = topicFor(parts[1], parts[2]);
        if (!topic) return defaultRoute();
        if (parts[0] === "topic") return { kind: "topic", projectId: parts[1], topicId: parts[2], view: new Set(["graph", "sources", "session"]).has(parts[3]) ? parts[3] : "graph" };
        if (parts[0] === "concept" && graphState(topic).graph.nodes.some(item => item.id === parts[3])) return { kind: "concept", projectId: parts[1], topicId: parts[2], conceptId: parts[3] };
        if (parts[0] === "artifact" && topic.artifacts.some(item => item.id === parts[3])) return { kind: "artifact", projectId: parts[1], topicId: parts[2], artifactId: parts[3] };
        return { kind: "topic", projectId: parts[1], topicId: parts[2], view: "graph" };
      }

      function activeSession(topic) {
        const current = data.workspace.current;
        return data.session?.active && current?.projectId === topic?.projectId && current?.topicId === topic?.id ? data.session : null;
      }

      function graphState(topic) {
        const session = activeSession(topic);
        const proposal = session?.kind === "graph-proposal";
        const graph = proposal ? session.proposedGraph : topic.graph;
        const known = new Set(proposal ? session.proposedKnownSet : topic.knownSet);
        const paused = (topic.reconciliationRequired && !proposal) || (proposal && session.stale);
        const parents = new Map(graph.nodes.map(item => [item.id, []]));
        graph.edges.forEach(edge => parents.get(edge.to)?.push(edge.from));
        const frontier = new Set(paused ? [] : graph.nodes.filter(item => !known.has(item.id) && parents.get(item.id).every(id => known.has(id))).map(item => item.id));
        const state = id => known.has(id) ? "known" : frontier.has(id) ? "ready" : "later";
        return { graph, known, frontier, state, paused, session, proposal };
      }

      function closeSidebar(focusMenu = false) {
        sidebar.classList.remove("open");
        syncSidebar();
        if (focusMenu && mobile.matches) $("#menu").focus();
      }

      function syncSidebar() {
        if (!mobile.matches) sidebar.classList.remove("open");
        const open = mobile.matches && sidebar.classList.contains("open");
        const closed = mobile.matches && !open;
        sidebar.inert = closed;
        workspace.inert = open;
        sidebar.setAttribute("aria-hidden", closed ? "true" : "false");
        $("#scrim").hidden = !open;
        $("#menu").setAttribute("aria-expanded", open ? "true" : "false");
        $("#menu").setAttribute("aria-label", open ? "Close navigation" : "Open navigation");
      }

      function setStatus(topic, route, artifact) {
        const status = $("#status");
        status.hidden = !topic;
        status.className = "status";
        if (!topic) return;
        const session = activeSession(topic);
        const previewAffectsView = session?.kind === "graph-proposal" || (route.kind === "topic" && route.view === "session");
        if (session?.stale && previewAffectsView) { status.textContent = "Stale preview"; status.classList.add("danger"); }
        else if (artifact?.stale) { status.textContent = "Stale artifact"; status.classList.add("danger"); }
        else if (session?.kind === "graph-proposal") { status.textContent = "Graph preview"; status.classList.add("warning"); }
        else if (topic.reconciliationRequired) { status.textContent = topic.reconciliationReasons.length ? "Graph stale" : "Review needed"; status.classList.add(topic.reconciliationReasons.length ? "danger" : "warning"); }
        else if (session?.kind === "answer" && route.view === "session") { status.textContent = "Answer preview"; status.classList.add("warning"); }
        else status.textContent = "Current";
      }

      function renderBreadcrumb(route, topic, artifact) {
        const host = $("#breadcrumb");
        host.replaceChildren();
        const parts = [{ label: data.workspace.name, href: routeHref("workspace") }];
        const project = route.projectId && projectFor(route.projectId);
        if (project) parts.push({ label: project.name, href: routeHref("project", project.id) });
        if (topic) parts.push({ label: topic.title, href: routeHref("topic", topic.projectId, topic.id, "graph") });
        if (artifact) parts.push({ label: artifact.title });
        else if (route.kind === "concept") parts.push({ label: graphState(topic).graph.nodes.find(item => item.id === route.conceptId)?.label });
        else if (route.kind === "topic" && route.view !== "graph") parts.push({ label: route.view === "sources" ? "Sources" : "Preview" });
        parts.forEach((part, index) => {
          const last = index === parts.length - 1;
          host.append(last ? node("strong", { text: part.label }) : node("a", { href: part.href, text: part.label }));
          if (!last) host.append(document.createTextNode("  ›  "));
        });
      }

      function renderSidebar(route, topic) {
        $("#workspace-name").textContent = data.workspace.name;
        const tree = $("#project-tree");
        tree.replaceChildren();
        data.workspace.projects.forEach(project => {
          const details = node("details", { class: "project" });
          details.open = project.id === route.projectId;
          details.append(node("summary", { text: project.name }));
          const list = node("ul", { class: "plain-list" });
          project.topics.forEach(item => {
            const current = project.id === route.projectId && item.id === route.topicId;
            const link = node("a", { class: "topic-link", href: routeHref("topic", project.id, item.id, "graph"), text: item.name });
            if (current) link.setAttribute("aria-current", "page");
            list.append(node("li", {}, link));
          });
          if (!project.topics.length) list.append(node("li", { class: "meta", text: "No topics yet." }));
          details.append(list); tree.append(details);
        });
        const nav = $("#view-nav");
        nav.hidden = !topic;
        [$("#open-graph"), $("#open-sources"), $("#open-session")].forEach(link => link.removeAttribute("aria-current"));
        if (!topic) { $("#concept-index").hidden = true; $("#answer-index").hidden = true; return; }
        $("#open-graph").href = routeHref("topic", topic.projectId, topic.id, "graph");
        $("#open-sources").href = routeHref("topic", topic.projectId, topic.id, "sources");
        const session = activeSession(topic);
        $("#open-session").hidden = !session;
        if (session) $("#open-session").href = routeHref("topic", topic.projectId, topic.id, "session");
        if (route.kind === "topic") $(route.view === "sources" ? "#open-sources" : route.view === "session" ? "#open-session" : "#open-graph").setAttribute("aria-current", "page");

        const graph = graphState(topic);
        const state = graph.state;
        const artifacts = new Map(topic.artifacts.filter(item => item.conceptId).map(item => [item.conceptId, item]));
        const concepts = $("#concept-list");
        concepts.replaceChildren();
        graph.graph.nodes.slice().sort(compareConcepts).forEach(concept => {
          const artifact = artifacts.get(concept.id);
          const value = state(concept.id);
          const label = value === "known" ? "Known" : value === "ready" ? "Ready next" : "Later";
          const href = artifact ? routeHref("artifact", topic.projectId, topic.id, artifact.id) : routeHref("concept", topic.projectId, topic.id, concept.id);
          const link = node("a", { class: "note-link", href }, node("span", { class: `state-dot ${value}`, "aria-hidden": "true" }), node("span", { class: "note-name", text: concept.label }), node("span", { class: "state-label", text: artifact?.stale ? `${label} · stale material` : label }));
          if ((route.kind === "concept" && route.conceptId === concept.id) || (route.kind === "artifact" && route.artifactId === artifact?.id)) link.setAttribute("aria-current", "page");
          concepts.append(node("li", {}, link));
        });
        $("#concept-index").hidden = !graph.graph.nodes.length;
        const answers = topic.artifacts.filter(item => item.conceptId === null);
        const answerList = $("#answer-list");
        answerList.replaceChildren(...answers.map(item => {
          const link = node("a", { class: "note-link", href: routeHref("artifact", topic.projectId, topic.id, item.id), text: item.title });
          if (route.kind === "artifact" && route.artifactId === item.id) link.setAttribute("aria-current", "page");
          return node("li", {}, link);
        }));
        $("#answer-index").hidden = !answers.length;
      }

      function appendInline(host, value) {
        const inlinePattern = /(`[^`\n]+`|\*\*[^*\n]+\*\*|(?<![\p{L}\p{N}_])__[^_\n]+__(?![\p{L}\p{N}_])|\[[^\]\n]+\]\([^\s)]+\)|\*[^*\n]+\*|(?<![\p{L}\p{N}_])_[^_\n]+_(?![\p{L}\p{N}_]))/gu;
        let last = 0;
        for (const match of value.matchAll(inlinePattern)) {
          if (match.index > last) host.append(document.createTextNode(value.slice(last, match.index)));
          const token = match[0];
          if (token.startsWith("`")) host.append(node("code", { text: token.slice(1, -1) }));
          else if (token.startsWith("**") || token.startsWith("__")) host.append(node("strong", { text: token.slice(2, -2) }));
          else if (token.startsWith("[")) {
            const parts = token.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
            const href = safeHttps(parts[2]);
            host.append(href ? node("a", { href, target: "_blank", rel: "noopener noreferrer", text: parts[1] }) : document.createTextNode(parts[1]));
          } else host.append(node("em", { text: token.slice(1, -1) }));
          last = match.index + token.length;
        }
        if (last < value.length) host.append(document.createTextNode(value.slice(last)));
      }

      function renderMarkdown(markdown) {
        const fragment = document.createDocumentFragment();
        const lines = text(markdown).replace(/\r\n?/g, "\n").split("\n");
        const special = line => !line.trim() || /^```/.test(line) || /^#{1,6}\s+/.test(line) || /^>\s?/.test(line) || /^\s*[-+*]\s+/.test(line) || /^\s*\d+[.)]\s+/.test(line) || /^(?:---+|\*\*\*+)\s*$/.test(line);
        for (let index = 0; index < lines.length;) {
          const line = lines[index];
          if (!line.trim()) { index += 1; continue; }
          const fence = line.match(/^```([a-z0-9_-]*)\s*$/i);
          if (fence) {
            const code = [];
            for (index += 1; index < lines.length && !/^```\s*$/.test(lines[index]); index += 1) code.push(lines[index]);
            if (index < lines.length) index += 1;
            const codeNode = node("code", { text: code.join("\n") });
            if (fence[1]) codeNode.setAttribute("data-language", fence[1]);
            fragment.append(node("pre", {}, codeNode)); continue;
          }
          const heading = line.match(/^(#{1,6})\s+(.+)$/);
          if (heading) { const h = node(heading[1].length >= 4 ? "h4" : "h3"); appendInline(h, heading[2]); fragment.append(h); index += 1; continue; }
          if (/^(?:---+|\*\*\*+)\s*$/.test(line)) { fragment.append(node("hr")); index += 1; continue; }
          if (/^>\s?/.test(line)) {
            const quote = [];
            while (index < lines.length && /^>\s?/.test(lines[index])) quote.push(lines[index++].replace(/^>\s?/, ""));
            const paragraph = node("p"); appendInline(paragraph, quote.join(" ")); fragment.append(node("blockquote", {}, paragraph)); continue;
          }
          const listMatch = line.match(/^\s*([-+*]|\d+[.)])\s+(.+)$/);
          if (listMatch) {
            const ordered = /^\d/.test(listMatch[1]);
            const list = node(ordered ? "ol" : "ul");
            if (ordered) list.start = Number.parseInt(listMatch[1], 10);
            while (index < lines.length) {
              const item = lines[index].match(/^\s*([-+*]|\d+[.)])\s+(.+)$/);
              if (!item || /^\d/.test(item[1]) !== ordered) break;
              const li = node("li"); appendInline(li, item[2]); list.append(li); index += 1;
            }
            fragment.append(list); continue;
          }
          const paragraphLines = [line];
          index += 1;
          while (index < lines.length && !special(lines[index])) paragraphLines.push(lines[index++]);
          const paragraph = node("p"); appendInline(paragraph, paragraphLines.join(" ")); fragment.append(paragraph);
        }
        return fragment;
      }

      function citationNode(citation, topic) {
        const item = node("li");
        const source = sourceFor(topic, citation.sourceId);
        const href = source && safeLocal(source.href);
        item.append(href ? node("a", { href, target: "_blank", rel: "noopener", text: source.title }) : node("strong", { text: source?.title || citation.sourceId }));
        item.append(document.createTextNode(` — ${citation.locator}${citation.note ? ` · ${citation.note}` : ""}`));
        return item;
      }

      function renderSections(content, topic) {
        const byCitation = new Map(content.citations.map(citation => [citation.id, citation]));
        return content.sections.map(section => {
          const host = node("section", { class: `content-section ${section.kind}` });
          host.append(node("span", { class: "section-label", text: section.kind }));
          if (section.purpose) host.append(node("span", { class: "section-label", text: section.purpose }));
          host.append(node("h2", { text: section.title }), renderMarkdown(section.markdown));
          const references = node("footer", { class: "references" }, node("h3", { text: "References" }));
          const list = node("ol");
          section.citationIds.forEach(id => list.append(citationNode(byCitation.get(id), topic)));
          references.append(list); host.append(references);
          return host;
        });
      }

      function renderOverview(route) {
        const host = node("article", { class: "document" });
        if (route.kind === "workspace") {
          host.append(node("h1", { text: data.workspace.name }), node("p", { class: "lede", text: "Projects and topics in this learning workspace." }));
          const list = node("ul", { class: "cards" });
          data.workspace.projects.forEach(project => list.append(node("li", {}, node("a", { class: "card", href: routeHref("project", project.id) }, node("strong", { text: project.name }), node("small", { text: `${project.topics.length} topic${project.topics.length === 1 ? "" : "s"}` })))));
          host.append(data.workspace.projects.length ? list : node("div", { class: "empty", text: "No projects yet. Create one in chat." }));
        } else {
          const project = projectFor(route.projectId);
          host.append(node("h1", { text: project.name }), node("p", { class: "lede", text: "Topics in this project." }));
          const list = node("ul", { class: "cards" });
          project.topics.forEach(item => list.append(node("li", {}, node("a", { class: "card", href: routeHref("topic", project.id, item.id, "graph") }, node("strong", { text: item.name }), node("small", { text: "Open concept graph" })))));
          host.append(project.topics.length ? list : node("div", { class: "empty", text: "No topics yet. Add one in chat." }));
        }
        main.append(host);
      }

      function graphCallout(topic, state) {
        if (state.proposal && state.session.stale) return node("div", { class: "callout danger", role: "alert", text: `This preview is stale and must not be approved. ${state.session.staleReasons.join(" ")}` });
        if (state.proposal) return node("div", { class: "callout", text: "Unapproved graph preview. Approve or correct it in chat." });
        if (topic.reconciliationRequired) return node("div", { class: topic.reconciliationReasons.length ? "callout danger" : "callout", role: "status", text: topic.reconciliationReasons.length ? `The graph is stale. ${topic.reconciliationReasons.join(" ")} Reconcile it in chat before graph-based learning.` : "The concept graph needs review in chat before graph-based learning." });
        return null;
      }

      function layoutGraph(graph) {
        const byId = new Map(graph.nodes.map(item => [item.id, item]));
        const indegree = new Map(graph.nodes.map(item => [item.id, 0]));
        const children = new Map(graph.nodes.map(item => [item.id, []]));
        graph.edges.forEach(edge => { indegree.set(edge.to, indegree.get(edge.to) + 1); children.get(edge.from).push(edge.to); });
        const depth = new Map(graph.nodes.map(item => [item.id, 0]));
        const ready = graph.nodes.filter(item => indegree.get(item.id) === 0).sort(compareConcepts).map(item => item.id);
        for (let cursor = 0; cursor < ready.length; cursor += 1) {
          const id = ready[cursor];
          children.get(id).sort((a, b) => compareConcepts(byId.get(a), byId.get(b))).forEach(child => {
            depth.set(child, Math.max(depth.get(child), depth.get(id) + 1));
            indegree.set(child, indegree.get(child) - 1);
            if (indegree.get(child) === 0) ready.push(child);
          });
        }
        const layers = [];
        graph.nodes.forEach(item => (layers[depth.get(item.id)] ||= []).push(item));
        layers.forEach(layer => layer.sort(compareConcepts));
        const box = { width: 190, height: 68, xGap: 72, yGap: 26, margin: 34 };
        const rows = Math.max(1, ...layers.map(layer => layer.length));
        const width = box.margin * 2 + layers.length * box.width + Math.max(0, layers.length - 1) * box.xGap;
        const height = box.margin * 2 + rows * box.height + Math.max(0, rows - 1) * box.yGap;
        const points = new Map();
        layers.forEach((layer, column) => {
          const layerHeight = layer.length * box.height + Math.max(0, layer.length - 1) * box.yGap;
          const startY = (height - layerHeight) / 2;
          layer.forEach((item, row) => points.set(item.id, { x: box.margin + column * (box.width + box.xGap), y: startY + row * (box.height + box.yGap), item }));
        });
        return { width, height, points, box };
      }

      function renderGraph(topic) {
        const state = graphState(topic);
        const host = node("article", { class: "document wide" }, node("h1", { text: topic.title }), node("p", { class: "meta", text: `${topic.eyebrow} · updated ${topic.updatedAt}` }), node("p", { class: "lede", text: topic.summary }));
        const callout = graphCallout(topic, state); if (callout) host.append(callout);
        if (!state.graph.nodes.length) {
          host.append(node("div", { class: "empty", text: topic.reconciliationRequired ? "The concept graph is waiting for review in chat." : "No concepts yet." })); main.append(host); return;
        }
        const layout = layoutGraph(state.graph);
        const svgNs = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(svgNs, "svg");
        svg.setAttribute("class", "graph"); svg.setAttribute("viewBox", `0 0 ${layout.width} ${layout.height}`); svg.setAttribute("width", layout.width); svg.setAttribute("height", layout.height); svg.setAttribute("role", "group"); svg.setAttribute("aria-label", `Prerequisite graph with ${state.graph.nodes.length} concepts. Arrows point from prerequisite to dependent.`);
        const defs = document.createElementNS(svgNs, "defs");
        const marker = document.createElementNS(svgNs, "marker"); marker.setAttribute("id", "arrow"); marker.setAttribute("viewBox", "0 0 10 10"); marker.setAttribute("refX", "9"); marker.setAttribute("refY", "5"); marker.setAttribute("markerWidth", "6"); marker.setAttribute("markerHeight", "6"); marker.setAttribute("orient", "auto-start-reverse");
        const arrow = document.createElementNS(svgNs, "path"); arrow.setAttribute("d", "M 0 0 L 10 5 L 0 10 z"); arrow.setAttribute("fill", "#858585"); marker.append(arrow); defs.append(marker); svg.append(defs);
        state.graph.edges.forEach(edge => {
          const from = layout.points.get(edge.from), to = layout.points.get(edge.to);
          const pathNode = document.createElementNS(svgNs, "path");
          const x1 = from.x + layout.box.width, y1 = from.y + layout.box.height / 2, x2 = to.x, y2 = to.y + layout.box.height / 2, bend = Math.max(30, (x2 - x1) / 2);
          pathNode.setAttribute("class", "edge"); pathNode.setAttribute("d", `M ${x1} ${y1} C ${x1 + bend} ${y1}, ${x2 - bend} ${y2}, ${x2} ${y2}`); pathNode.setAttribute("marker-end", "url(#arrow)");
          const evidence = edge.evidence.map(item => `${sourceFor(topic, item.sourceId)?.title || item.sourceId} — ${item.locator}`).join("; ");
          const title = document.createElementNS(svgNs, "title"); title.textContent = `${from.item.label} is a prerequisite for ${to.item.label}. Evidence: ${evidence}.`; pathNode.append(title); svg.append(pathNode);
        });
        const artifacts = new Map(topic.artifacts.filter(item => item.conceptId).map(item => [item.conceptId, item]));
        state.graph.nodes.forEach(concept => {
          const point = layout.points.get(concept.id), value = state.state(concept.id);
          const artifact = artifacts.get(concept.id);
          const link = document.createElementNS(svgNs, "a"); link.setAttribute("href", artifact ? routeHref("artifact", topic.projectId, topic.id, artifact.id) : routeHref("concept", topic.projectId, topic.id, concept.id)); link.setAttribute("class", `graph-node ${value}`);
          const title = document.createElementNS(svgNs, "title"); title.textContent = `${concept.label}. ${value === "known" ? "Known" : value === "ready" ? "Ready next" : "Later"}. ${concept.description}`;
          const rect = document.createElementNS(svgNs, "rect"); rect.setAttribute("x", point.x); rect.setAttribute("y", point.y); rect.setAttribute("width", layout.box.width); rect.setAttribute("height", layout.box.height);
          const label = concept.label.length > 27 ? `${concept.label.slice(0, 26)}…` : concept.label;
          const textNode = document.createElementNS(svgNs, "text"); textNode.setAttribute("x", point.x + 13); textNode.setAttribute("y", point.y + 31); textNode.textContent = label;
          const stateNode = document.createElementNS(svgNs, "text"); stateNode.setAttribute("class", "graph-state"); stateNode.setAttribute("x", point.x + 13); stateNode.setAttribute("y", point.y + 51); stateNode.textContent = value === "known" ? "Known" : value === "ready" ? "Ready next" : "Later";
          link.append(title, rect, textNode, stateNode); svg.append(link);
        });
        host.append(node("div", { class: "graph-frame" }, svg), node("div", { class: "graph-legend" }, node("span", { class: "legend-item" }, node("span", { class: "state-dot known", "aria-hidden": "true" }), "Known"), node("span", { class: "legend-item" }, node("span", { class: "state-dot ready", "aria-hidden": "true" }), "Ready next"), node("span", { class: "legend-item" }, node("span", { class: "state-dot later", "aria-hidden": "true" }), "Later"), node("span", { text: "Arrows: prerequisite → dependent" })));
        main.append(host);
      }

      function renderSources(topic) {
        const host = node("article", { class: "document" }, node("h1", { text: "Sources" }), node("p", { class: "lede", text: `Text and PDF sources for ${topic.title}. Source content is not duplicated into this page.` }));
        const list = node("ul", { class: "cards" });
        topic.sources.forEach(source => {
          const href = safeLocal(source.href);
          const detail = [source.type, source.author, source.locator, `added ${source.addedAt}`].filter(Boolean).join(" · ");
          const content = node("div", { class: "card source-card" }, node("strong", { text: source.title }), node("small", { text: detail }));
          if (source.integrityProblem) content.append(node("p", { class: "source-problem", role: "alert", text: source.integrityProblem }));
          if (href) content.append(node("p", {}, node("a", { href, target: "_blank", rel: "noopener", text: "Open source" })));
          list.append(node("li", {}, content));
        });
        host.append(topic.sources.length ? list : node("div", { class: "empty", text: "No sources yet. Add text or a PDF in chat." })); main.append(host);
      }

      function renderConcept(topic, id) {
        const state = graphState(topic);
        const graph = state.graph;
        const byId = new Map(graph.nodes.map(item => [item.id, item]));
        const concept = byId.get(id);
        const value = state.state(id);
        const host = node("article", { class: "document" }, node("h1", { text: concept.label }), node("p", { class: "lede", text: concept.description }), node("div", { class: "concept-meta" }, node("span", { class: "badge", text: value === "known" ? "Known" : value === "ready" ? "Ready next" : "Later" })));
        const artifact = topic.artifacts.find(item => item.conceptId === id);
        if (artifact) host.append(node("p", {}, node("a", { href: routeHref("artifact", topic.projectId, topic.id, artifact.id), text: artifact.stale ? "Open stale learning material" : "Open learning material" })));
        else host.append(node("div", { class: "empty", text: "No learning material yet. Ask to learn this concept in chat." }));
        const prerequisites = graph.edges.filter(edge => edge.to === id).map(edge => ({ edge, concept: byId.get(edge.from) }));
        const dependents = graph.edges.filter(edge => edge.from === id).map(edge => ({ edge, concept: byId.get(edge.to) }));
        [["Prerequisites", prerequisites], ["Unlocks", dependents]].forEach(([title, items]) => {
          if (!items.length) return;
          const list = node("ul", { class: "relation-list" });
          items.forEach(item => {
            const evidence = node("ul", { class: "relation-list" });
            item.edge.evidence.forEach(reference => {
              const source = sourceFor(topic, reference.sourceId), href = source && safeLocal(source.href);
              evidence.append(node("li", {}, "Evidence: ", href ? node("a", { href, target: "_blank", rel: "noopener", text: source.title }) : node("strong", { text: source?.title || reference.sourceId }), ` — ${reference.locator}`));
            });
            list.append(node("li", {}, node("a", { href: routeHref("concept", topic.projectId, topic.id, item.concept.id), text: item.concept.label }), evidence));
          });
          host.append(node("h2", { text: title }), list);
        });
        const evidence = node("ul", { class: "relation-list" });
        concept.evidence.forEach(reference => { const source = sourceFor(topic, reference.sourceId), href = source && safeLocal(source.href); evidence.append(node("li", {}, href ? node("a", { href, target: "_blank", rel: "noopener", text: source.title }) : node("strong", { text: source?.title || reference.sourceId }), ` — ${reference.locator}`)); });
        host.append(node("h2", { text: "Grounding" }), evidence); main.append(host);
      }

      function renderArtifact(topic, artifact) {
        const host = node("article", { class: "document" }, node("h1", { text: artifact.title }), node("p", { class: "meta", text: `${artifact.kind === "concept" ? "Concept material" : "General answer"} · updated ${artifact.updatedAt}` }), node("p", { class: "lede", text: artifact.summary }));
        if (artifact.conceptId) host.append(node("p", {}, node("a", { href: routeHref("concept", topic.projectId, topic.id, artifact.conceptId), text: "View concept details and grounding" })));
        if (artifact.stale) host.append(node("div", { class: "callout danger", role: "alert", text: `This material is stale and must not be treated as current. ${artifact.staleReasons.join(" ")}` }));
        host.append(...renderSections(artifact, topic)); main.append(host);
      }

      function renderSession(topic) {
        const session = activeSession(topic);
        const host = node("article", { class: "document" }, node("h1", { text: session?.title || (session?.kind === "graph-proposal" ? "Graph proposal" : "Answer preview") }));
        if (!session) { host.append(node("div", { class: "empty", text: "No active preview." })); main.append(host); return; }
        if (session.context) host.append(node("p", { class: "lede", text: session.context }));
        if (session.stale) host.append(node("div", { class: "callout danger", role: "alert", text: `Do not approve or save this preview. ${session.staleReasons.join(" ")} Regenerate it from current state in chat.` }));
        host.append(...renderSections(session, topic), node("div", { class: session.stale ? "callout danger" : "callout", text: session.stale ? "This preview is non-approvable." : "Continue in chat to approve, correct, save, or discard this preview." })); main.append(host);
      }

      let focusContent = false;
      function render() {
        const route = parseRoute();
        const topic = route.topicId && topicFor(route.projectId, route.topicId);
        const artifact = topic && route.artifactId ? topic.artifacts.find(item => item.id === route.artifactId) : null;
        main.replaceChildren();
        main.scrollTop = 0;
        renderSidebar(route, topic);
        renderBreadcrumb(route, topic, artifact);
        setStatus(topic, route, artifact);
        document.title = `${artifact?.title || (route.kind === "concept" ? graphState(topic).graph.nodes.find(item => item.id === route.conceptId).label : topic?.title || projectFor(route.projectId)?.name || data.workspace.name)} — LEARN`;
        if (route.kind === "workspace" || route.kind === "project") renderOverview(route);
        else if (route.kind === "artifact") renderArtifact(topic, artifact);
        else if (route.kind === "concept") renderConcept(topic, route.conceptId);
        else if (route.view === "sources") renderSources(topic);
        else if (route.view === "session") renderSession(topic);
        else renderGraph(topic);
        closeSidebar();
        if (focusContent) main.focus({ preventScroll: true });
        focusContent = true;
      }

      $("#menu").addEventListener("click", () => {
        if (sidebar.classList.toggle("open")) { syncSidebar(); sidebar.querySelector("a").focus(); }
        else closeSidebar(true);
      });
      $("#skip").addEventListener("click", () => main.focus());
      $("#scrim").addEventListener("click", () => closeSidebar(true));
      window.addEventListener("keydown", event => {
        if (!sidebar.classList.contains("open")) return;
        if (event.key === "Escape") { closeSidebar(true); return; }
        if (event.key !== "Tab") return;
        const focusable = [...sidebar.querySelectorAll("a[href], summary, button:not([disabled])")].filter(item => item.offsetParent !== null);
        const first = focusable[0], last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      });
      window.addEventListener("hashchange", render);
      if (mobile.addEventListener) mobile.addEventListener("change", syncSidebar); else mobile.addListener(syncSidebar);
      if (!location.hash) {
        const route = defaultRoute();
        history.replaceState(null, "", route.kind === "workspace" ? routeHref("workspace") : routeHref("topic", route.projectId, route.topicId, route.view));
      }
      syncSidebar(); render();
    })();
  </script>
</body>
</html>
